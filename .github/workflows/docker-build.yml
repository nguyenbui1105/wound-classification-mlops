name: Docker Build & Push

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check Docker Hub secrets availability
      id: secrets_check
      run: |
        if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
          echo "available=true" >> $GITHUB_OUTPUT
          echo "✅ Docker Hub secrets are configured" >> $GITHUB_STEP_SUMMARY
        else
          echo "available=false" >> $GITHUB_OUTPUT
          echo "⚠️ Docker Hub secrets not configured - build will run but skip push" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 To enable Docker Hub push:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to: Settings → Secrets and variables → Actions" >> $GITHUB_STEP_SUMMARY
          echo "2. Add \`DOCKERHUB_USERNAME\` (your Docker Hub username)" >> $GITHUB_STEP_SUMMARY
          echo "3. Add \`DOCKERHUB_TOKEN\` (create at https://hub.docker.com/settings/security)" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      if: steps.secrets_check.outputs.available == 'true' && github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Generate Docker metadata
      id: meta
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

        if [[ "${{ steps.secrets_check.outputs.available }}" == "true" && "${{ github.event_name }}" != "pull_request" ]]; then
          echo "tags=nguyenbui1105/wound-api:latest,nguyenbui1105/wound-api:sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "push=true" >> $GITHUB_OUTPUT
        else
          echo "tags=nguyenbui1105/wound-api:latest" >> $GITHUB_OUTPUT
          echo "push=false" >> $GITHUB_OUTPUT
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: ${{ steps.meta.outputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

    - name: Build summary
      run: |
        echo "## 🐳 Docker Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| **Event** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Commit** | \`${{ steps.meta.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Pushed** | \`${{ steps.meta.outputs.push }}\` |" >> $GITHUB_STEP_SUMMARY
        if [[ "${{ steps.meta.outputs.push }}" == "true" ]]; then
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Published Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`nguyenbui1105/wound-api:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`nguyenbui1105/wound-api:sha-${{ steps.meta.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
        fi

